[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cracha-ingestion"
version = "0.1.0"
description = "CraCha RAG Ingestion Pipeline with Crawl4AI"
authors = [{name = "CraCha Team"}]
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
    # Core HTTP and async
    "aiohttp>=3.8.0",
    "httpx>=0.24.0",
    "requests>=2.28.0",
    "asyncio-throttle>=1.0.0",
    
    # Data validation and processing
    "pydantic>=2.0.0",
    "numpy>=1.21.0",
    
    # Retry and error handling
    "tenacity>=8.0.0",
    "backoff>=2.2.0",
    
    # Environment and system
    "python-dotenv>=1.0.0",
    "psutil>=5.9.0",
    
    # Crawling and web scraping
    "crawl4ai>=0.2.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=4.9.0",
    
    # AI and embeddings
    "openai>=1.0.0",
    "google-generativeai>=0.3.0",
    
    # FastAPI for Modal.com hosting
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    
    # Modal.com client
    "modal>=0.60.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=22.0.0",
    "isort>=5.0.0",
    "mypy>=1.0.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["*"]

[tool.black]
line-length = 100
target-version = ['py38']

[tool.isort]
profile = "black"
line_length = 100