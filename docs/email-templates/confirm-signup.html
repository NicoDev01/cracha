<!--
  Supabase → Authentication → Emails → "Confirm signup"
  Subject: Bestätige deine E-Mail-Adresse
  Paste everything below this comment into the Message body field.

  The link goes to cracha-app.com/confirm with the token hash, not to
  Supabase's own verify URL. A mail from cracha-app.com whose only link points
  at a random *.supabase.co host is a classic phishing pattern and was the main
  reason this mail landed in spam. /confirm verifies the hash itself
  (src/app/(auth)/confirm/route.ts).

  Same look as src/lib/email/activation-reminder.ts and reset-password.html:
  light, the wordmark as PNG (mail clients do not show SVG), one brand-blue
  button, nothing else. Inline CSS and tables, because Gmail strips <style>
  and Outlook ignores flexbox.
-->
<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Bestätige deine E-Mail-Adresse</title>
</head>
<body style="margin:0;padding:0;background-color:#f2f7ff;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">Ein Klick, dann ist dein CraCha-Konto aktiv.</div>
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#f2f7ff;padding:40px 16px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
  <tr>
    <td align="center">
      <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="max-width:480px;">
        <tr>
          <td align="center" style="padding:0 0 24px 0;">
            <a href="https://cracha-app.com" style="text-decoration:none;"><img src="https://cracha-app.com/images/logo/logo-email.png?v=2" width="144" height="35" alt="CraCha" style="display:block;border:0;width:144px;height:35px;"></a>
          </td>
        </tr>
        <tr>
          <td style="background-color:#ffffff;border:1px solid #e4e7ec;border-radius:16px;padding:40px 36px;" align="center">
            <h1 style="margin:0;color:#101828;font-size:22px;font-weight:600;line-height:1.35;">Bestätige deine E-Mail-Adresse</h1>
            <p style="margin:12px 0 0 0;color:#667085;font-size:15px;line-height:1.6;">Ein Klick, dann ist dein Konto aktiv.</p>
            <table role="presentation" cellpadding="0" cellspacing="0" border="0" style="margin:28px auto 0 auto;">
              <tr>
                <td style="background-color:#465fff;border-radius:10px;">
                  <a href="https://cracha-app.com/confirm?token_hash={{ .TokenHash }}&amp;type=email&amp;next=/dashboard" style="display:inline-block;padding:13px 32px;color:#ffffff;font-size:15px;font-weight:600;text-decoration:none;">E-Mail bestätigen</a>
                </td>
              </tr>
            </table>
            <p style="margin:28px 0 0 0;color:#98a2b3;font-size:13px;line-height:1.6;">Nicht registriert? Dann ignoriere diese E-Mail.</p>
          </td>
        </tr>
        <tr>
          <td align="center" style="padding:24px 0 0 0;color:#98a2b3;font-size:12px;line-height:1.6;">
            CraCha · Nicolas Guerrero Tello · Meyerstraße 216 · 28201 Bremen<br>
            <a href="https://cracha-app.com" style="color:#98a2b3;text-decoration:underline;">cracha-app.com</a>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
