name: Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cracha-production
  cancel-in-progress: false

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  preflight:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The frontend job writes these into the Worker. Checked here, before any
      # deploy starts, because an empty value would replace a
      # working production secret.
      - name: Refuse to overwrite Worker secrets with empty values
        run: |
          missing=""
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_ANON_KEY SUPABASE_SERVICE_ROLE_KEY STRIPE_API_KEY STRIPE_WEBHOOK_SECRET MODAL_CRAWLER_URL CRAWLER_API_SECRET RAG_QUERY_SECRET; do
            [ -n "${!name}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then echo "Missing GitHub secrets:$missing"; exit 1; fi
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          MODAL_CRAWLER_URL: ${{ secrets.MODAL_CRAWLER_URL }}
          CRAWLER_API_SECRET: ${{ secrets.CRAWLER_API_SECRET }}
          RAG_QUERY_SECRET: ${{ secrets.RAG_QUERY_SECRET }}
      - run: npx tsx scripts/preflight-release.ts
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          MODAL_CRAWLER_URL: ${{ secrets.MODAL_CRAWLER_URL }}
          CONFIRM_AUTH_HOOK_BEFORE_USER_CREATED: ${{ secrets.CONFIRM_AUTH_HOOK_BEFORE_USER_CREATED || vars.CONFIRM_AUTH_HOOK_BEFORE_USER_CREATED }}
          PREFLIGHT_SKIP_CRAWLER: 'true'

  build-frontend:
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build:cf
        env:
          NEXT_PUBLIC_BUILD_SHA: ${{ github.sha }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
      - uses: actions/upload-artifact@v4
        with:
          name: open-next-build
          path: .open-next
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  verify-build:
    needs: build-frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: open-next-build
          path: .open-next
      - name: Verify build artifact contents
        run: |
          test -f .open-next/worker.js || { echo "Missing .open-next/worker.js"; exit 1; }
          test -d .open-next/assets || { echo "Missing .open-next/assets"; exit 1; }
          test -s .open-next/worker.js || { echo ".open-next/worker.js is empty"; exit 1; }

  rag-worker:
    needs: verify-build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: workers/rag-api
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: workers/rag-api
          command: deploy
          secrets: |
            INGEST_SECRET
            QUERY_SECRET
        env:
          INGEST_SECRET: ${{ secrets.RAG_INGEST_SECRET }}
          QUERY_SECRET: ${{ secrets.RAG_QUERY_SECRET }}

  crawler:
    needs: rag-worker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e services/crawler
      - run: modal deploy services/crawler/modal_app.py
        env:
          MODAL_TOKEN_ID: ${{ secrets.MODAL_TOKEN_ID }}
          MODAL_TOKEN_SECRET: ${{ secrets.MODAL_TOKEN_SECRET }}
      # The frontend needs the crawler's billing protocol and settlement callback.
      - name: Verify crawler health and billing protocol
        run: |
          for attempt in 1 2 3 4 5 6; do
            body=$(curl -fsS -m 30 "${MODAL_CRAWLER_URL%/}/health" || true)
            if echo "$body" | python -c "import json,sys; d=json.load(sys.stdin); sys.exit(0 if d.get('billing_protocol')==1 and d.get('settlement_configured') is True else 1)" 2>/dev/null; then
              echo "Crawler healthy: $body"; exit 0
            fi
            echo "Attempt $attempt: $body"; sleep 10
          done
          echo "Crawler lacks billing_protocol 1 or CRAWLER_SETTLEMENT_URL in the Modal secret"; exit 1
        env:
          MODAL_CRAWLER_URL: ${{ secrets.MODAL_CRAWLER_URL }}

  frontend:
    needs: [crawler, verify-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v4
        with:
          name: open-next-build
          path: .open-next
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          secrets: |
            NEXT_PUBLIC_SUPABASE_URL
            NEXT_PUBLIC_SUPABASE_ANON_KEY
            SUPABASE_SERVICE_ROLE_KEY
            STRIPE_API_KEY
            STRIPE_WEBHOOK_SECRET
            MODAL_CRAWLER_URL
            CRAWLER_API_SECRET
            RAG_QUERY_SECRET
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          STRIPE_API_KEY: ${{ secrets.STRIPE_API_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          MODAL_CRAWLER_URL: ${{ secrets.MODAL_CRAWLER_URL }}
          CRAWLER_API_SECRET: ${{ secrets.CRAWLER_API_SECRET }}
          RAG_QUERY_SECRET: ${{ secrets.RAG_QUERY_SECRET }}
      - run: node scripts/smoke-release.mjs https://cracha-app.com "${{ github.sha }}"
