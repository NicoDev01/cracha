name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  billing:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: test-only
          POSTGRES_DB: cracha_billing_test
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      BILLING_TEST_DATABASE_URL: postgresql://postgres:test-only@localhost:5432/cracha_billing_test
    steps:
      - uses: actions/checkout@v4
      - run: python scripts/test-billing.py

  frontend:
    runs-on: ubuntu-latest
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
      NEXT_PUBLIC_CRACHA_WORKER_URL: https://example.workers.dev
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: bash scripts/npm-audit.sh
      - run: npm run lint
      - run: npm run type-check
      - run: npm test
      - run: npm run build

  rag-worker:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: workers/rag-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: workers/rag-api/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: bash ../../scripts/npm-audit.sh

  crawler:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e "services/crawler[dev]"
      - run: python -m playwright install --with-deps chromium
      - run: python -m ruff check services/crawler evals
      - run: python -m pytest services/crawler/tests evals/test_evaluate.py
