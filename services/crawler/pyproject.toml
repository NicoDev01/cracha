[project]
name = "cracha-crawler"
version = "1.0.0"
requires-python = ">=3.11"
dependencies = [
  "crawl4ai==0.9.2",
  "defusedxml==0.7.1",
  "fastapi==0.141.1",
  "httpx==0.28.1",
  "modal==1.5.3",
  "pydantic==2.13.4"
]

[project.optional-dependencies]
dev = ["pytest==9.1.1", "pytest-asyncio==1.4.0", "ruff==0.16.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
